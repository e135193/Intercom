; ESP32-S3 Opus Interkom - PlatformIO yapilandirmasi
;
; Dikkat: ESP-IDF CMake sinirlamasi geregi proje yolu bosluk icermemelidir.
; Derleme:   pio run
; Yukleme:   pio run -t upload
; Monitor:   pio device monitor  (115200)

[platformio]
default_envs = esp32-s3

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1          ; 8 MB flash (N8), 240 MHz
framework = espidf
monitor_speed = 115200

; 8 MB PSRAM: octal moduller (N8R8) icin. Quad PSRAM'li modulde "quad" yapin.
; Ayrinti: sdkconfig.defaults icindeki CONFIG_SPIRAM_* satirlari.
board_build.psram_type = octal

; Uygulama bolumu: 1500K (varsayilan singleapp 1M idi ve %97 doluydu;
; kucuk bir degisiklikte linker tasmasi olusurdu). 8 MB flash'ta yeterli.
board_build.partitions = partitions_singleapp_large.csv